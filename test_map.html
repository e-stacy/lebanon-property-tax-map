<!DOCTYPE html>
<html>
<head>
    <title>Map Functionality Test</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 400px; width: 100%; }
        .status { padding: 10px; background: #f0f0f0; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Map Functionality Test</h1>
    <div id="status" class="status">Testing map functionality...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let statusDiv = document.getElementById('status');

        function updateStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.className = isError ? 'status error' : 'status success';
        }

        async function testMapFunctionality() {
            try {
                // Initialize map
                map = L.map('map').setView([43.6424, -72.2517], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                updateStatus('Map initialized successfully');

                // Test spatial data loading
                updateStatus('Loading spatial data...');
                const spatialResponse = await fetch('data/processed/spatial/parcels_wgs84.geojson');
                if (!spatialResponse.ok) {
                    throw new Error(`Spatial data fetch failed: ${spatialResponse.status}`);
                }
                const spatialData = await spatialResponse.json();
                updateStatus(`Spatial data loaded: ${spatialData.features?.length || 0} features`);

                // Test property data loading
                updateStatus('Loading property data...');
                const propertyResponse = await fetch('data/processed/parcels.csv');
                if (!propertyResponse.ok) {
                    throw new Error(`Property data fetch failed: ${propertyResponse.status}`);
                }
                const propertyText = await propertyResponse.text();
                const propertyLines = propertyText.trim().split('\n');
                updateStatus(`Property data loaded: ${propertyLines.length - 1} records`);

                // Add spatial layer to map
                const parcelsLayer = L.geoJSON(spatialData, {
                    style: { color: '#000000', weight: 2, fillColor: '#87CEEB', fillOpacity: 0.3 },
                    onEachFeature: function(feature, layer) {
                        const mapLot = feature.properties?.MAP_LOT || 'Unknown';
                        layer.bindPopup(`Parcel: ${mapLot}`);
                    }
                }).addTo(map);

                updateStatus(`✅ Map fully functional! ${spatialData.features?.length || 0} parcels displayed`);

            } catch (error) {
                updateStatus(`❌ Error: ${error.message}`, true);
                console.error('Map test error:', error);
            }
        }

        // Run the test
        testMapFunctionality();
    </script>
</body>
</html>
